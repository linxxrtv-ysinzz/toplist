<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonlist | SwapGDPS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>Демонлист</h1>
                    <p>Система листов на сервере SwapGDPS</p>
                </div>
                <div class="nav">
                    <!-- <a href="#">Главная</a> -->
                    <a href="#" class="nav-active">Демонлист</a>
                    <a href="send.html">Отправить</a>
                    <a href="rules.html">Правила</a>
                    <a href="#">Подробнее</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="api-stat-total">N/A</div>
                <div class="stat-label">Всего Уровней</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="api-stat-demonlist">N/A</div>
                <div class="stat-label">В Демонлисте</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="api-stat-downloads">N/A</div>
                <div class="stat-label">Всего Скачиваний</div>
            </div>
            <div class="filter-bar">
                <button class="filter-btn active">Все</button>
                <button class="filter-btn">Экстримы</button>
                <button class="filter-btn">Инсейн</button>
                <button class="filter-btn">Хард</button>
            </div>
        </div>

        <!-- Demon Table -->
        <div class="table-wrapper">
            <table class="demon-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Уровень</th>
                        <th>Сложность</th>
                        <th>Видео</th>
                        <th>Скачиваний</th>
                    </tr>
                </thead>
                <tbody id="api-list">
                </tbody>
            </table>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>⚡ Toplist • Inspired by PointerCrate • Not affiliated with RobTop Games</p>
            <p style="margin-top: 8px;">Made by ysinzz • Please make respect</p>
        </footer>
    </main>

    <script type="module" src="bundle.js"></script>
</body>
</html>
